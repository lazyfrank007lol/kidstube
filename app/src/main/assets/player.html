<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KidsTube</title>
  <style>
    html, body { margin:0; padding:0; background:#111; height:100%; overflow:hidden; font-family:sans-serif; }
    #grid {
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background:#222; border-radius:12px; overflow:hidden; cursor:pointer;
    }
    .card img { width:100%; display:block; }
    .card .title { color:#fff; font-size:14px; padding:8px; }
    #player-wrap { position:fixed; top:0; left:0; width:100%; height:100%; display:none; background:#000; }
    #player { width:100%; height:100%; }
    #backBtn {
      position:fixed; top:16px; left:16px; z-index:10;
      background:rgba(0,0,0,0.6); color:#fff; border:none; border-radius:8px;
      padding:10px 16px; font-size:16px; display:none;
    }
  </style>
</head>
<body>

  <div id="grid"></div>
  <button id="backBtn" onclick="goBack()">&#8592; Quay lai</button>
  <div id="player-wrap"><div id="player"></div></div>

  <script>
    const PLAYLIST = [
      { id: "XqZsoesa55w", title: "Baby Shark Dance - Pinkfong" },
      { id: "e_04ZrNroTo", title: "Wheels on the Bus - Cocomelon" },
      { id: "lBCOzDvQJ-w", title: "Johny Johny Yes Papa - LooLoo Kids" },
      { id: "PoJBdOC6cLQ", title: "Five Little Monkeys - Super Simple Songs" },
      { id: "TXo6QKUEGVQ", title: "Old MacDonald Had a Farm - Cocomelon" },
      { id: "JqjV_mTdBgA", title: "Bath Song - Cocomelon" }
    ];

    // --- CAU HINH SKIP INTRO / OUTRO ---
    const INTRO_SKIP_SEC = 4;   // Bo qua N giay dau moi video (intro)
    const OUTRO_SKIP_SEC = 10;  // Chuyen video truoc khi ket thuc N giay (outro)

    const grid = document.getElementById('grid');
    PLAYLIST.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => playVideo(i);
      card.innerHTML = `
        <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg">
        <div class="title">${v.title}</div>
      `;
      grid.appendChild(card);
    });

    let player;
    let ytApiReady = false;
    let currentIndex = 0;
    let outroTimer = null;

    function onYouTubeIframeAPIReady() {
      ytApiReady = true;
    }

    function playVideo(index) {
      currentIndex = index;
      document.getElementById('grid').style.display = 'none';
      document.getElementById('player-wrap').style.display = 'block';
      document.getElementById('backBtn').style.display = 'block';

      const startPlaylist = () => {
        if (player) {
          player.loadVideoById(PLAYLIST[currentIndex].id);
          return;
        }
        player = new YT.Player('player', {
          videoId: PLAYLIST[currentIndex].id,
          playerVars: {
            autoplay: 1,
            controls: 1,
            rel: 0,
            modestbranding: 1,
            fs: 0,
            playsinline: 1,
            origin: 'https://www.youtube.com'
          },
          events: {
            onStateChange: onPlayerStateChange,
            onError: onPlayerError
          }
        });
      };

      if (ytApiReady) startPlaylist();
      else setTimeout(startPlaylist, 500);
    }

    function nextVideo() {
      clearInterval(outroTimer);
      currentIndex = (currentIndex + 1) % PLAYLIST.length;
      player.loadVideoById(PLAYLIST[currentIndex].id);
    }

    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.PLAYING) {
        // Skip intro: seek qua INTRO_SKIP_SEC giay dau
        if (INTRO_SKIP_SEC > 0) {
          const t = player.getCurrentTime();
          if (t < INTRO_SKIP_SEC) {
            player.seekTo(INTRO_SKIP_SEC, true);
          }
        }

        // Outro timer: poll moi giay, chuyen video truoc khi ket thuc
        clearInterval(outroTimer);
        if (OUTRO_SKIP_SEC > 0) {
          outroTimer = setInterval(function() {
            const duration = player.getDuration();
            const current  = player.getCurrentTime();
            if (duration > 0 && current >= duration - OUTRO_SKIP_SEC) {
              nextVideo();
            }
          }, 1000);
        }
      }

      // Video ket thuc binh thuong (fallback)
      if (e.data === YT.PlayerState.ENDED) {
        nextVideo();
      }

      // Dung timer khi pause / buffer
      if (e.data === YT.PlayerState.PAUSED ||
          e.data === YT.PlayerState.BUFFERING) {
        clearInterval(outroTimer);
      }
    }

    // Tu dong skip khi gap loi embedding (150/151/152/153/154)
    function onPlayerError(e) {
      console.warn('YouTube error:', e.data, '-- skipping');
      clearInterval(outroTimer);
      setTimeout(nextVideo, 1000);
    }

    function goBack() {
      clearInterval(outroTimer);
      if (player) player.stopVideo();
      document.getElementById('player-wrap').style.display = 'none';
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('grid').style.display = 'grid';
    }
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>

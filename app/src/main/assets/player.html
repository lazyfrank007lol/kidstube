<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KidsTube</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #111; height: 100%; font-family: sans-serif; overflow-y: auto; }
    h1 { color: #fff; text-align: center; padding: 16px 0 8px; font-size: 20px; }
    #grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 12px;
    }
    .card { background: #222; border-radius: 12px; overflow: hidden; cursor: pointer; }
    .card:active { opacity: 0.7; }
    .card img { width: 100%; display: block; }
    .card .title { color: #fff; font-size: 13px; padding: 8px; line-height: 1.3; }
  </style>
</head>
<body>
  <h1>KidsTube</h1>
  <div id="grid"></div>

  <script>
    // =============================================
    //  DANH SACH VIDEO -- sua videoId o day
    //  Lay ID tu URL: youtube.com/watch?v=XXXXX
    // =============================================
    var PLAYLIST = [
      { id: "XqZsoesa55w", title: "Baby Shark Dance - Pinkfong" },
      { id: "yCjJyiqpAuU", title: "Twinkle Twinkle Little Star - Super Simple Songs" },
      { id: "l4WNrvVjiTw", title: "The Wheels on the Bus - Super Simple Songs" },
      { id: "PoJBdOC6cLQ", title: "Five Little Monkeys - Super Simple Songs" },
      { id: "e_04ZrNroTo", title: "Old MacDonald Had a Farm - Super Simple Songs" },
      { id: "tpMH10dMoNY", title: "Baa Baa Black Sheep - Super Simple Songs" }
    ];

    var grid = document.getElementById('grid');
    PLAYLIST.forEach(function(v, i) {
      var card = document.createElement('div');
      card.className = 'card';
      // Goi Android bridge de navigate thang den YouTube (khong dung iframe/embed)
      card.onclick = function() {
        Android.playVideo(v.id);
      };
      card.innerHTML =
        '<img src="https://img.youtube.com/vi/' + v.id + '/mqdefault.jpg" loading="lazy">' +
        '<div class="title">' + v.title + '</div>';
      grid.appendChild(card);
    });
  </script>
</body>
</html>

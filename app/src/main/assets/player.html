<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KidsTube</title>
  <style>
    html, body { margin:0; padding:0; background:#111; height:100%; overflow:hidden; font-family:sans-serif; }
    #grid {
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background:#222; border-radius:12px; overflow:hidden; cursor:pointer;
    }
    .card img { width:100%; display:block; }
    .card .title { color:#fff; font-size:14px; padding:8px; }
    #player-wrap { position:fixed; top:0; left:0; width:100%; height:100%; display:none; background:#000; }
    #player { width:100%; height:100%; }
    #backBtn {
      position:fixed; top:16px; left:16px; z-index:10;
      background:rgba(0,0,0,0.6); color:#fff; border:none; border-radius:8px;
      padding:10px 16px; font-size:16px; display:none;
    }
  </style>
</head>
<body>

  <!--
    DANH SÃCH VIDEO Cá» Äá»ŠNH â€” CHá»ˆ Sá»¬A á»ž ÄÃ‚Y
    Láº¥y videoId tá»« URL youtube.com/watch?v=XXXXXXXX  (XXXXXXXX chÃ­nh lÃ  id)
  -->
  <div id="grid"></div>

  <button id="backBtn" onclick="goBack()">â† Quay láº¡i</button>
  <div id="player-wrap"><div id="player"></div></div>

  <script>
        const PLAYLIST = [
      { id: "XqZsoesa55w", title: "Baby Shark Dance - Pinkfong" },
      { id: "e_04ZrNroTo", title: "Wheels on the Bus - Cocomelon" },
      { id: "lBCOzDvQJ-w", title: "Johny Johny Yes Papa - LooLoo Kids" },
      { id: "PoJBdOC6cLQ", title: "Five Little Monkeys - Super Simple Songs" },
      { id: "TXo6QKUEGVQ", title: "Old MacDonald Had a Farm - Cocomelon" },
      { id: "JqjV_mTdBgA", title: "Bath Song - Cocomelon" }
    ];

    const grid = document.getElementById('grid');
    PLAYLIST.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => playVideo(i);
      card.innerHTML = `
        <img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg">
        <div class="title">${v.title}</div>
      `;
      grid.appendChild(card);
    });

    let player;
    let ytApiReady = false;

    function onYouTubeIframeAPIReady() {
      ytApiReady = true;
    }

    function playVideo(index) {
      document.getElementById('grid').style.display = 'none';
      document.getElementById('player-wrap').style.display = 'block';
      document.getElementById('backBtn').style.display = 'block';

      const startPlaylist = () => {
        if (player) {
          player.loadVideoById(PLAYLIST[index].id);
          return;
        }
        player = new YT.Player('player', {
          videoId: PLAYLIST[index].id,
          playerVars: {
            autoplay: 1,
            controls: 1,
            rel: 0,          // háº¡n cháº¿ gá»£i Ã½ video ngoÃ i kÃªnh
            modestbranding: 1,
            fs: 0,            // táº¯t nÃºt fullscreen riÃªng (app Ä‘Ã£ fullscreen)
            playsinline: 1,
            origin: 'https://www.youtube.com'
          },
          events: {
            onStateChange: onPlayerStateChange
          }
        });
      };

      if (ytApiReady) startPlaylist();
      else setTimeout(startPlaylist, 500);
    }

    // Khi video káº¿t thÃºc -> tá»± chuyá»ƒn video TIáº¾P THEO TRONG DANH SÃCH Cá» Äá»ŠNH
    // (khÃ´ng rÆ¡i vÃ o gá»£i Ã½ random cá»§a YouTube)
    let currentIndex = 0;
    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.ENDED) {
        currentIndex = (currentIndex + 1) % PLAYLIST.length;
        player.loadVideoById(PLAYLIST[currentIndex].id);
      }
    }

    function goBack() {
      if (player) player.stopVideo();
      document.getElementById('player-wrap').style.display = 'none';
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('grid').style.display = 'grid';
    }
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KidsTube</title>
  <style>
    html, body { margin:0; padding:0; background:#111; height:100%; overflow:hidden; font-family:sans-serif; }
    #grid {
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
    }
    .card { background:#222; border-radius:12px; overflow:hidden; cursor:pointer; }
    .card img { width:100%; display:block; }
    .card .title { color:#fff; font-size:14px; padding:8px; }
    #player-wrap { position:fixed; top:0; left:0; width:100%; height:100%; display:none; background:#000; }
    #player { width:100%; height:100%; }
    #backBtn {
      position:fixed; top:16px; left:16px; z-index:10;
      background:rgba(0,0,0,0.6); color:#fff; border:none; border-radius:8px;
      padding:10px 16px; font-size:16px; display:none;
    }
  </style>
</head>
<body>

  <div id="grid"></div>
  <button id="backBtn" onclick="goBack()">&#8592; Back</button>
  <div id="player-wrap"><div id="player"></div></div>

  <script>
    // --- DANH SACH VIDEO ---
    // Super Simple Songs: channel noi tieng CHO PHEP EMBED
    // Thay bang videoId cua rieng ban neu muon
    const PLAYLIST = [
      { id: "XqZsoesa55w", title: "Baby Shark - Pinkfong" },
      { id: "yCjJyiqpAuU", title: "Twinkle Twinkle Little Star - Super Simple Songs" },
      { id: "l4WNrvVjiTw", title: "The Wheels on the Bus - Super Simple Songs" },
      { id: "PoJBdOC6cLQ", title: "Five Little Monkeys - Super Simple Songs" },
      { id: "e_04ZrNroTo", title: "Baa Baa Black Sheep - Super Simple Songs" },
      { id: "tpMH10dMoNY", title: "Old MacDonald Had a Farm - Super Simple Songs" }
    ];

    // --- CAU HINH ---
    const INTRO_SKIP_SEC = 4;   // Bo qua N giay dau (intro)
    const OUTRO_SKIP_SEC = 10;  // Chuyen video khi con N giay (outro)

    // Build grid
    const grid = document.getElementById('grid');
    PLAYLIST.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => playVideo(i);
      card.innerHTML =
        '<img src="https://img.youtube.com/vi/' + v.id + '/mqdefault.jpg">' +
        '<div class="title">' + v.title + '</div>';
      grid.appendChild(card);
    });

    let player;
    let ytApiReady = false;
    let currentIndex = 0;
    let outroTimer = null;

    function onYouTubeIframeAPIReady() {
      ytApiReady = true;
    }

    function playVideo(index) {
      currentIndex = index;
      document.getElementById('grid').style.display = 'none';
      document.getElementById('player-wrap').style.display = 'block';
      document.getElementById('backBtn').style.display = 'block';

      const start = function() {
        if (player) {
          player.loadVideoById(PLAYLIST[currentIndex].id);
          return;
        }
        player = new YT.Player('player', {
          videoId: PLAYLIST[currentIndex].id,
          // FIX CHINH: dung youtube-nocookie.com -- it bi chan embed hon nhieu
          host: 'https://www.youtube-nocookie.com',
          playerVars: {
            autoplay:       1,
            controls:       1,
            rel:            0,
            modestbranding: 1,
            fs:             0,
            playsinline:    1,
            enablejsapi:    1,
            origin:         'https://www.youtube.com'
          },
          events: {
            onStateChange: onPlayerStateChange,
            onError:       onPlayerError
          }
        });
      };

      if (ytApiReady) start();
      else setTimeout(start, 500);
    }

    function nextVideo() {
      clearInterval(outroTimer);
      currentIndex = (currentIndex + 1) % PLAYLIST.length;
      player.loadVideoById(PLAYLIST[currentIndex].id);
    }

    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.PLAYING) {
        // Skip intro
        if (INTRO_SKIP_SEC > 0 && player.getCurrentTime() < INTRO_SKIP_SEC) {
          player.seekTo(INTRO_SKIP_SEC, true);
        }
        // Outro polling
        clearInterval(outroTimer);
        if (OUTRO_SKIP_SEC > 0) {
          outroTimer = setInterval(function() {
            var dur = player.getDuration();
            var cur = player.getCurrentTime();
            if (dur > 0 && cur >= dur - OUTRO_SKIP_SEC) nextVideo();
          }, 1000);
        }
      }
      if (e.data === YT.PlayerState.ENDED) nextVideo();
      if (e.data === YT.PlayerState.PAUSED ||
          e.data === YT.PlayerState.BUFFERING) {
        clearInterval(outroTimer);
      }
    }

    // Auto-skip neu video bi chan embed
    function onPlayerError(e) {
      console.warn('YouTube error ' + e.data + ' -- auto-skip');
      clearInterval(outroTimer);
      setTimeout(nextVideo, 800);
    }

    function goBack() {
      clearInterval(outroTimer);
      if (player) player.stopVideo();
      document.getElementById('player-wrap').style.display = 'none';
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('grid').style.display = 'grid';
    }
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
